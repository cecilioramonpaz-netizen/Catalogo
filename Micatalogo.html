<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Interactivo</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --primary: #27ae60; --dark: #2c3e50; --light: #f4f7f6; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: var(--light); color: #333; padding-bottom: 90px; }
        header { background: var(--dark); color: white; text-align: center; padding: 2rem 1rem; border-bottom: 4px solid var(--primary); }
        .logo-area { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-bottom: 0.5rem; text-transform: uppercase; }
        .container { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .card-img-container { position: relative; width: 100%; padding-top: 100%; background: #eee; }
        .card-img { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 0.8rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 1rem; margin: 0 0 0.3rem 0; color: var(--dark); font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-desc { font-size: 0.8rem; color: #666; margin: 0 0 0.5rem 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-price { font-size: 1.1rem; color: var(--primary); font-weight: bold; margin-bottom: 0.8rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 0.6rem; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; width: 100%; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .status-msg { text-align: center; grid-column: 1 / -1; padding: 2rem; color: #666; font-size: 1.1rem; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); padding: 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 1000; max-width: 600px; margin: 0 auto; border-radius: 16px 16px 0 0; }
        .cart-info { font-weight: bold; font-size: 1.1rem; }
        .btn-whatsapp { background: #25D366; border: none; padding: 0.8rem 1.5rem; font-size: 1rem; border-radius: 50px; box-shadow: 0 4px 10px rgba(37,211,102,0.3); text-decoration: none; color: white; display: flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer; }
        @media(min-width: 600px) { .grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">🏬 MI NEGOCIO</div>
        <h1 style="margin:0; font-size: 1.6rem;">Catálogo Web</h1>
        <p style="margin: 5px 0 0 0; font-size: 0.9rem; color: #ccc;">Armá tu pedido en tiempo real</p>
    </header>

    <div class="container">
        <div id="productos-grid" class="grid">
            <div class="status-msg"><i class="fa-solid fa-spinner fa-spin"></i> Cargando inventario en vivo...</div>
        </div>
    </div>

    <div class="cart-bar">
        <div class="cart-info">
            <i class="fa-solid fa-cart-shopping" style="color: var(--primary)"></i> 
            <span id="cart-count">0</span> art. | Total: $<span id="cart-total">0</span>
        </div>
        <button class="btn-whatsapp" onclick="enviarPedido()">
            <i class="fa-brands fa-whatsapp"></i> Enviar Pedido
        </button>
    </div>

    <script>
        const SHEET_ID = "1s81rkujB14u8WoMdYeeX4IM3CLw02MQoW_ddcOyQPJ";
        const WHATSAPP_NUMERO = "3416716782"; 
        
        let productos = [];
        let carrito = {};

        async function cargarDatosDesdeSheets() {
            // Nueva ruta de extracción directa optimizada
            const url = `https://google.com{SHEET_ID}/pub?output=csv`;
            
            try {
                const respuesta = await fetch(url);
                if (!respuesta.ok) throw new Error("No se pudo conectar.");
                const textoCsv = await respuesta.text();
                procesarDatosCsv(textoCsv);
            } catch (error) {
                console.error(error);
                document.getElementById('productos-grid').innerHTML = `
                    <div class="status-msg" style="color: #e74c3c;">
                        <i class="fa-solid fa-triangle-exclamation"></i> Error al conectar.<br>
                        <span style="font-size:0.9rem; color:#666;">Asegúrate de ir a Archivo -> Compartir -> "Publicar en la web" en tu Google Sheets.</span>
                    </div>`;
            }
        }

        function procesarDatosCsv(csv) {
            // Dividir por líneas e ignorar líneas vacías
            const filas = csv.split(/\r?\n/).filter(f => f.trim() !== "");
            productos = [];
            
            if (filas.length <= 1) {
                renderizarCatalogo();
                return;
            }

            // Recorrer filas (saltando la de títulos de la fila 1)
            for (let i = 1; i < filas.length; i++) {
                // Separar de forma simple por comas
                const columnas = filas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                // Limpiar comillas de los textos
                const limpiar = texto => (texto || "").replace(/^"|"$/g, '').trim();

                if (columnas.length >= 4) {
                    productos.push({
                        id: limpiar(columnas[0]) || "ID-" + i,
                        nombre: limpiar(columnas[1]),
                        descripcion: limpiar(columnas[2]),
                        precio: parseFloat(columnas[3].replace(/[^0-9.]/g, '')) || 0,
                        imagen: limpiar(columnas[4]) || "https://picsum.photos"
                    });
                }
            }
            renderizarCatalogo();
        }

        function renderizarCatalogo() {
            const grid = document.getElementById('productos-grid');
            grid.innerHTML = "";
            
            if (productos.length === 0) {
                grid.innerHTML = '<div class="status-msg">⚠️ No hay productos cargados en tu Google Sheets todavía. Agrega filas debajo de los títulos.</div>';
                return;
            }
            
            productos.forEach(prod => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img-container">
                            <img class="card-img" src="${prod.imagen}" alt="${prod.nombre}" onerror="this.src='https://picsum.photos'">
                        </div>
                        <div class="card-body">
                            <div>
                                <h3 class="card-title">${prod.nombre}</h3>
                                <p class="card-desc">${prod.descripcion}</p>
                            </div>
                            <div>
                                <div class="card-price">$${prod.precio.toLocaleString('es-AR')}</div>
                                <button class="btn" onclick="agregarAlCarrito('${prod.id}')">
                                    <i class="fa-solid fa-plus"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function agregarAlCarrito(id) {
            carrito[id] = (carrito[id] || 0) + 1;
            actualizarInterfazCarrito();
        }

        function actualizarInterfazCarrito() {
            let totalArticulos = 0;
            let precioTotal = 0;
            
            Object.keys(carrito).forEach(id => {
                let prod = productos.find(p => p.id == id);
                if(prod) {
                    totalArticulos += carrito[id];
                    precioTotal += prod.precio * carrito[id];
                }
            });
            
            document.getElementById('cart-count').innerText = totalArticulos;
            document.getElementById('cart-total').innerText = precioTotal.toLocaleString('es-AR');
        }

        function enviarPedido() {
            if (Object.keys(carrito).length === 0) {
                alert("El carrito está vacío.");
                return;
            }
            
            let textoPedido = "¡Hola! Quisiera hacer el siguiente pedido:\n\n";
            let precioTotal = 0;
            
            Object.keys(carrito).forEach(id => {
                let prod = productos.find(p => p.id == id);
                if(prod) {
                    textoPedido += `▪️ *${carrito[id]}x* ${prod.nombre} ($${prod.precio})\n`;
                    precioTotal += (prod.precio * carrito[id]);
                }
            });
            
            textoPedido += `\n💰 *Total:* $${precioTotal.toLocaleString('es-AR')}\n`;
            
            let url = `https://whatsapp.com{WHATSAPP_NUMERO}&text=${encodeURIComponent(textoPedido)}`;
            window.location.href = url;
        }

        window.onload = cargarDatosDesdeSheets;
    </script>
</body>
</html>
